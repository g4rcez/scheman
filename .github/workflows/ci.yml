name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Smoke test
        run: |
          bin="$(swift build -c release --show-bin-path)/scheman"
          "$bin" --version
          "$bin" get mailto
